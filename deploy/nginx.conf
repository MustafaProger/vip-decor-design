limit_req_zone $binary_remote_addr zone=vip_forms:10m rate=6r/m;
server {
    listen 443 ssl;
    server_name vip2d.ru;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/vip2d.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vip2d.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location ^~ /assets/ {
        root /opt/vip-decor/current/dist;
        try_files $uri =404;
        gzip on;
        gzip_vary on;
        gzip_types text/css application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }
    location ~ ^/api/(content|blog)$ {
        gzip on;
        gzip_vary on;
        gzip_types application/json;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/inquiries {
        limit_req zone=vip_forms burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name vip2d.ru www.vip2d.ru;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://vip2d.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.vip2d.ru;
    ssl_certificate /etc/letsencrypt/live/vip2d.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vip2d.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://vip2d.ru$request_uri;
}
